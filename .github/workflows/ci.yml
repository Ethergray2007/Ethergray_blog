name: CI

permissions:
  contents: read

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - reopened

  workflow_call:

jobs:
  build:
    name: Code standards & build
    runs-on: ubuntu-latest
    timeout-minutes: 5

    # 文章页面已改为运行时动态读库（src/lib/publicPosts.ts），
    # 离线构建本身不再依赖读取文章快照；但保留 DATABASE_URL 注入，
    # 方便后续需要连库检查的脚本或流水线步骤复用。
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - name: "☁️ Checkout repository"
        uses: actions/checkout@v4

      - name: "Use Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: "📦 Install dependencies"
        run: npm ci

      - name: "🔎 Lint code"
        run: npm run lint

      - name: "📝 Check code format"
        run: npm run format:check

      # 单独列出来，而不是只依赖 build 里的 astro check：
      # 这样失败时能一眼看出是"类型错了"还是"构建挂了"。
      # 注意顺序和 AGENTS.md 里写的一致 —— 快的先跑，
      # format:check 能抓到 astro check 和 build 都抓不到的错。
      - name: "🧪 Type check"
        run: npx astro check

      - name: "🚀 Build the project"
        run: npm run build

      # 【为什么这些测试能在 CI 里跑】
      # 全部 10 套测试都设计成**不联网、不需要线上数据库**：
      #   · 数据层与动态数据测试用 PGlite（进程内的 PostgreSQL）现场建空库
      #   · API 层用 alwaysLoggedIn / neverLoggedIn 替身代替真实登录
      #   · 重建通知用替身，不会真的去请求 Netlify
      #
      # 【它覆盖什么】
      # 数据层约束与映射、API 访问控制与增删改查、认证 fail-closed、
      # 动态公开数据与正文 Markdown/Mermaid 渲染、实时搜索与分页边界、
      # 订阅源 XML 格式，以及友链/说说/项目三个静态集合的排序规则。
      - name: "✅ Run tests"
        run: npm test
