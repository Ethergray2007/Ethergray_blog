name: CI

permissions:
  contents: read

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - reopened

  workflow_call:

jobs:
  build:
    name: Code standards & build
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: "☁️ Checkout repository"
        uses: actions/checkout@v4

      - name: "Use Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: "📦 Install dependencies"
        run: npm ci

      - name: "🔎 Lint code"
        run: npm run lint

      - name: "📝 Check code format"
        run: npm run format:check

      # 单独列出来，而不是只依赖 build 里的 astro check：
      # 这样失败时能一眼看出是"类型错了"还是"构建挂了"。
      # 注意顺序和 AGENTS.md 里写的一致 —— 快的先跑，
      # format:check 能抓到 astro check 和 build 都抓不到的错。
      - name: "🧪 Type check"
        run: npx astro check

      - name: "🚀 Build the project"
        run: npm run build
